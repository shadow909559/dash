name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd apps/backend
          python -m pytest -q --tb=short
        env:
          DASH_ENV: test
          DASH_DATABASE_URL: sqlite+aiosqlite:///test.db
          DASH_JWT_SECRET_KEY: test-secret

      - name: Build Docker image
        run: |
          docker build -t dash-backend:${{ github.ref_name }} -f apps/backend/Dockerfile .
          docker tag dash-backend:${{ github.ref_name }} dash-backend:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push dash-backend:${{ github.ref_name }}
          docker push dash-backend:latest

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build web
        run: |
          cd apps/mobile
          flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: apps/mobile/build/web

  create-release:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          echo "# DASH AI Operating System ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## Changes" >> release-notes.md
          git log $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --oneline >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            apps/backend/Dockerfile
            docker-compose.yml

