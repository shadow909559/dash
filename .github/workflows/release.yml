name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd apps/backend
          python -m pytest tests -q --tb=short
        env:
          DASH_ENV: test
          DASH_DATABASE_URL: sqlite+aiosqlite:///test.db

      # Context MUST be apps/backend so its .dockerignore excludes .env/*.db
      - name: Build Docker image
        run: |
          docker build -t dash-backend:${{ github.ref_name }} -f apps/backend/Dockerfile apps/backend
          docker tag dash-backend:${{ github.ref_name }} dash-backend:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push dash-backend:${{ github.ref_name }}
          docker push dash-backend:latest

  build-mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-companion-release-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk

  create-release:
    needs: [build-backend, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          echo "# DASH AI Operating System ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## Changes" >> release-notes.md
          git log $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --oneline >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            apps/backend/Dockerfile
            docker-compose.yml

