name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-lint:
    name: Backend lint (compileall + import gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Compile check (warnings as errors)
        # -W error::SyntaxWarning: invalid escape sequences and similar
        # future-SyntaxErrors fail here instead of surfacing as warnings
        # on dev machines. -f forces recompilation (CI checkouts are
        # fresh, so nothing is skipped by stale bytecode caches).
        run: python -W error::SyntaxWarning -m compileall -q -f dash_backend scripts tests

      - name: Check for undeclared third-party imports
        run: python scripts/check_undeclared_imports.py

  backend-test:
    name: Backend tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, total: 6 }
          - { shard: 1, total: 6 }
          - { shard: 2, total: 6 }
          - { shard: 3, total: 6 }
          - { shard: 4, total: 6 }
          - { shard: 5, total: 6 }
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio

      - name: Run backend tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        # JUnit report per shard: triage failures (which shard, which tests)
        # without re-running anything.
        run: python -m pytest tests -q --tb=short --junitxml=test-results/shard-${{ matrix.shard }}.xml
        env:
          DASH_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          # Hermetic test environment — no real credentials in CI.
          DASH_CRM_DIR: ${{ runner.temp }}/dash-crm
          DASH_STATE_DIR: ${{ runner.temp }}/dash-state

      - name: Upload shard test report
        if: always()  # reports matter most when the job fails
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-results
          path: apps/backend/test-results/shard-${{ matrix.shard }}.xml
          if-no-files-found: error

  desktop:
    name: Desktop typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
