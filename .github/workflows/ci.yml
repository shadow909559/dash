name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests + compileall
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall -q dash_backend

      - name: Check for undeclared third-party imports
        run: python scripts/check_undeclared_imports.py

      - name: Run backend tests
        run: python -m pytest tests -q --tb=short
        env:
          # Hermetic test environment — no real credentials in CI.
          DASH_CRM_DIR: ${{ runner.temp }}/dash-crm
          DASH_STATE_DIR: ${{ runner.temp }}/dash-state

  desktop:
    name: Desktop typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
