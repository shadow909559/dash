name: Backend Tests & Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dash_test
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Check formatting with black
        run: |
          pip install black
          black --check --diff .

      - name: Run tests
        env:
          DASH_ENV: test
          DASH_DATABASE_URL: postgresql+asyncpg://dash:dash_test@localhost:5432/dash_test
          DASH_JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          python -m pytest -q --tb=short --cov=dash_backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend

