name: Backend CI

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop, feature/**]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dash_test
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      # Single source of truth: pyproject.toml ([dev] extra includes pytest,
      # pytest-asyncio, ruff, black, mypy, aiosqlite).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      # Blocking: syntax integrity of the whole package.
      - name: Compile check
        run: python -m compileall dash_backend -q

      # Blocking: full test suite incl. auth/filesystem/sandbox/tool regressions.
      - name: Run tests
        env:
          DASH_ENV: test
          DASH_DATABASE_URL: sqlite+aiosqlite:///test_ci.db
        run: |
          python -m pytest tests -q --tb=short --cov=dash_backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: success() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage.xml
          flags: backend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Advisory only: the codebase carries ~400 pre-existing style findings;
      # tracked as tech-debt. Do not let them block security/test gates.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check dash_backend tests --output-format=github

      - name: Format check (advisory)
        continue-on-error: true
        run: black --check --diff dash_backend tests
