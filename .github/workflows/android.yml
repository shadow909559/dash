name: Android Build & Test

# The canonical mobile app is Kotlin/Jetpack Compose (apps/mobile).
# There is NO Flutter project in this repository; the old flutter.yml
# workflow was removed because it referenced a nonexistent pubspec.yaml.

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, feature/**]
    paths:
      - 'apps/mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile + resources + dex (blocking)
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # Unit tests (blocking when present; passes with NO-SOURCE today)
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dash-companion-debug
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
