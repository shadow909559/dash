[alembic]
script_location = apps/backend/alembic
# This file is kept intentionally minimal; the actual DB URL is
# sourced from the DASH_DATABASE_URL env var (or the default in code).
# Override with: alembic -c alembic.ini -x database_url=...

# Alembic uses this to render the connection URL for offline mode.
# For online mode we override in env.py.
sqlalchemy.url = driver://user:pass@localhost/db

# Version table name
version_table = alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s


