[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dash-backend"
version = "0.1.0"
description = "DASH FastAPI backend"
requires-python = ">=3.11,<3.15"
# ── SINGLE SOURCE OF TRUTH for runtime dependencies ──────────────────
# requirements.txt is GENERATED from this table (see header there).
# Install for development:  pip install -e ".[dev]"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # Postgres drivers: asyncpg for the async app, psycopg for alembic's
    # synchronous online migrations (alembic/env.py rewrites the DSN).
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.2.0",
    "python-dotenv>=1.0.1",
    "websockets>=14.0,<16.0",
    "httpx>=0.28.0",
    # Optional cloud data layer. DASH Core continues to use its local services.
    "supabase>=2.31.0,<3.0.0",
    # Required by FastAPI multipart/form parsing (UploadFile endpoints:
    # image_upload, file_transfer)
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
    "py-cpuinfo>=9.0.0",
    "mss>=10.0.0",
    "Pillow>=10.0.0",
    # Clipboard read/write on all platforms.
    "pyperclip>=1.8.0",
    # Desktop automation: mouse, keyboard, screenshots.
    "pyautogui>=0.9.54",
    # Vision pipeline math (hard import in vision/recognition.py); tests
    # also use it for fixture generation. Previously arrived only as a
    # transitive dependency on dev machines — CI collection failed (#137).
    "numpy>=1.26",
    # HTML parsing for the scraper (top-level import in browser/web_scraper.py).
    "beautifulsoup4>=4.12",
    # Fernet/AES-GCM secrets at rest: secrets_manager.py and
    # security_hardening.py import it at module scope.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Any test that hangs fails with a stack dump after the timeout instead
    # of stalling CI forever (decisions.md #44).
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    # JPEG decode/encode + warpAffine used by vision tests as fixture
    # helpers; production code feature-detects cv2, so this stays a test
    # dependency only (#137).
    "opencv-python-headless>=4.8",
]
vision = [
    # OCR is feature-detected at runtime; install only if OCR is wanted.
    "pytesseract>=0.3.10",
]
voice = [
    "SpeechRecognition>=3.10.0",
]
voice-stt = [
    # Local speech-to-text engines, feature-detected at import. The provider
    # prefers faster-whisper (CTranslate2, ~3-4x faster on CPU) and falls
    # back to openai-whisper when it is absent or fails to load.
    "faster-whisper>=1.0.0",
    "openai-whisper>=20231117",
]

[project.scripts]
dash-backend = "dash_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["dash_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Kill hangs: per-test ceiling (thread method works on Windows + POSIX).
# Real-service integration tests (piper synthesis, app boot) finish well
# under this; a stuck subprocess or deadlock now FAILS instead of freezing
# the whole run.
timeout = 60
timeout_method = "thread"
