[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dash-backend"
version = "0.1.0"
description = "DASH FastAPI backend"
requires-python = ">=3.11,<3.15"
# ── SINGLE SOURCE OF TRUTH for runtime dependencies ──────────────────
# requirements.txt is GENERATED from this table (see header there).
# Install for development:  pip install -e ".[dev]"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # Postgres drivers: asyncpg for the async app, psycopg for alembic's
    # synchronous online migrations (alembic/env.py rewrites the DSN).
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.2.0",
    "python-dotenv>=1.0.1",
    "websockets>=14.0,<16.0",
    "httpx>=0.28.0",
    # Optional cloud data layer. DASH Core continues to use its local services.
    "supabase>=2.31.0,<3.0.0",
    # Required by FastAPI multipart/form parsing (UploadFile endpoints:
    # image_upload, file_transfer)
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
    "py-cpuinfo>=9.0.0",
    "mss>=10.0.0",
    "Pillow>=10.0.0",
    # Clipboard read/write on all platforms.
    "pyperclip>=1.8.0",
    # Desktop automation: mouse, keyboard, screenshots.
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]
vision = [
    # OCR is feature-detected at runtime; install only if OCR is wanted.
    "pytesseract>=0.3.10",
]
voice = [
    "SpeechRecognition>=3.10.0",
]

[project.scripts]
dash-backend = "dash_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["dash_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
