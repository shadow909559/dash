version: '3.8'

# Production Docker Compose configuration for DASH AI Operating System
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15
    container_name: dash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dash}
      POSTGRES_USER: ${POSTGRES_USER:-dash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dash}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dash-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dash-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: dash-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DASH_ENV: production
      DASH_DEBUG: "false"
      DASH_LOG_LEVEL: WARNING
      DASH_HOST: "0.0.0.0"
      DASH_PORT: 8000
      DASH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dash}
      DASH_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DASH_JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      DASH_JWT_ALGORITHM: HS256
      DASH_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      DASH_REFRESH_TOKEN_EXPIRE_DAYS: 30
      DASH_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.dash.example.com}
      DASH_AI_PROVIDER: ${AI_PROVIDER:-openai}
      DASH_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASH_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dash-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: dash-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/mobile/build/web:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - dash-network

networks:
  dash-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_data:
  letsencrypt:

